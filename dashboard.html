<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
</head>
<body>
    <header>
        <input type="search" placeholder="Search...">
    </header>

    <br>

    <nav>
        <ul>
        <li>Group 1
            <ul>
            <li><a href="#">Link 1</a></li>
            </ul>
        </li>
        <li>Group 2
            <ul>
            <li><a href="#">Link 2</a></li>
            </ul>
        </li>
        </ul>
    </nav>

    <br>

    <main>
        <section id="cards">
            <article>Card 1</article>
            <article>Card 2</article>
            <article>Card 3</article>
        </section>

        <br>

        <aside id="notifications">
            Notification content is here.
        </aside>

        <br>

        <section id="transactions">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2025-12-15</td>
                        <td>Transaction 1</td>
                        <td>$100.00</td>
                    </tr>
                    <tr>
                        <td>2025-12-16</td>
                        <td>Transaction 2</td>
                        <td>$200.00</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
